<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Ficha Fotográfica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
        #pdf-container { width: 100%; height: 100%; overflow: auto; text-align: center; padding-top: 10px; }
        .pdf-page { display: block; margin: 0 auto 20px auto; max-width: 95%; box-shadow: 0 4px 15px rgba(0,0,0,0.8); background: white; border-radius: 4px; }
        #loading { color: #ffb703; font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem; text-align: center; padding: 40px; letter-spacing: 2px; }
    </style>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
    <div id="loading">CARGANDO FICHA FOTOGRÁFICA...<br><span style="font-size:1rem; color:#888;">Renderizando en dispositivo</span></div>
    <div id="pdf-container"></div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');
        
        if(fileUrl) {
            pdfjsLib.getDocument(fileUrl).promise.then(pdf => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('pdf-container');
                
                // Renderizar todas las páginas secuencialmente
                for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    pdf.getPage(pageNum).then(page => {
                        // Calcular escala para móvil vs desktop
                        const scale = 4.0; // Renderizar a super alta resolución
                        const viewport = page.getViewport({ scale: scale });
                        
                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page';
                        const context = canvas.getContext('2d');
                        
                        // Tamaño físico del canvas (alta resolución)
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        // Tamaño visual en la pantalla (ajustado al contenedor)
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        
                        container.appendChild(canvas);
                        
                        page.render({ canvasContext: context, viewport: viewport });
                    });
                }
            }).catch(err => {
                document.getElementById('loading').innerHTML = "ERROR AL CARGAR PDF.<br><span style='font-size:1rem; color:red;'>" + err.message + "</span><br><br><a href='" + fileUrl + "' style='color:#fff;'>Toca aquí para descargarlo manualmente</a>";
            });
        } else {
            document.getElementById('loading').innerText = "ERROR: No se especificó el archivo.";
        }
    </script>
</body>
</html>
