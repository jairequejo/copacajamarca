<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#001a4d">
  <title>Portal Delegados · Copa Cajamarca</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* Inline CSS for the redesign */
    :root {
      --navy: #001a4d;
      --navy-light: #00287a;
      --gold: #ffba00;
      --gold-dark: #f1a200;
      --gold-light: #ffce4d;
      --red: #d60d0d;
      --red-hover: #b90b0b;
      --bg: #eef2f7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--navy);
      background-image: repeating-linear-gradient(-45deg, transparent 0, transparent 28px, rgba(255,255,255,.014) 28px, rgba(255,255,255,.014) 29px);
      min-height: 100dvh;
      font-family: 'Barlow', sans-serif;
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    /* HEADER TEMPLATE */
    .site-header {
      background: var(--navy);
      width: 100%;
      z-index: 10;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }
    .header-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
      box-shadow: 0 0 0 2px rgba(255,186,0,.5), 0 3px 10px rgba(0,0,0,.35);
    }
    .header-title-sup {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: rgba(255,255,255,.55);
      text-transform: uppercase;
    }
    .header-title-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      color: #fff;
      letter-spacing: .04em;
      line-height: 1;
    }
    .page-bar {
      background: var(--gold);
      border-bottom: 3px solid var(--gold-dark);
    }
    .page-bar-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .content-wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px 60px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* GENERAL CARD */
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,186,0,0.18);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    /* BUTTONS */
    .btn-primary {
      background: var(--gold);
      color: #5a4400;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 16px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      min-height: 52px;
      transition: transform .15s, box-shadow .15s, background .15s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255,186,0,.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,186,0,.4);
      background: var(--gold-light);
    }
    .btn-primary:active { transform: scale(0.98); }

    /* VAULT LOGIN */
    #login-view {
      max-width: 440px;
      padding: 48px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
    }
    @media (max-width: 480px) {
      #login-view { padding: 40px 20px; }
    }
    /* Dramatic glow effect behind the logo */
    #login-view::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255,186,0,0.15) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }
    .login-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
      box-shadow: 0 0 0 4px rgba(255,186,0,.6), 0 8px 32px rgba(255,186,0,.3);
      margin: 0 auto 24px;
      display: block;
      position: relative;
      z-index: 1;
    }
    #logo-fb-del {
      display: none;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--navy);
      border: 4px solid var(--gold);
      margin: 0 auto 24px;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.2rem;
      color: var(--gold);
      box-shadow: 0 8px 32px rgba(255,186,0,.2);
      position: relative;
      z-index: 1;
    }
    .login-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem;
      color: #fff;
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    .login-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.6);
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    .dni-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 16px;
      display: block;
      text-align: center;
    }
    .dni-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-bottom: 40px;
    }
    .dni-box {
      width: 100%;
      aspect-ratio: 1 / 1.3;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,.15);
      color: #fff;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      text-align: center;
      padding: 0;
      outline: none;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    @media (max-width: 400px) {
      .dni-grid { gap: 5px; }
      .dni-box { font-size: 1.6rem; border-radius: 6px; }
    }
    .dni-box:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,186,0,.25), inset 0 2px 4px rgba(0,0,0,0.4);
      transform: translateY(-3px);
      background: rgba(255,186,0,.08);
      color: var(--gold);
    }
    .dni-box.filled {
      border-color: var(--gold);
      background: rgba(255,186,0,.15);
      color: var(--gold);
    }

    /* DASHBOARD */
    #dashboard {
      display: none;
      width: 100%;
      max-width: 760px;
    }
    .dash-header {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,186,0,0.3);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.05);
      flex-wrap: wrap;
      gap: 24px;
    }
    .dash-brand {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
      min-width: 280px;
    }
    .dash-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      color: #fff;
      line-height: 1;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .dash-team {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 6px;
    }
    #del-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
      border: 3px solid var(--gold);
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    
    #btn-logout {
      background: rgba(214,13,13,.15);
      color: #ff6b6b;
      border: 1px solid rgba(214,13,13,.4);
      padding: 14px 28px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #btn-logout:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      box-shadow: 0 4px 16px rgba(214,13,13,0.4);
    }

    /* SEARCH SECTION */
    .search-section {
      background: #fff;
      padding: 36px 28px;
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      border-top: 6px solid var(--gold);
      color: var(--navy);
    }
    .search-section h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: var(--navy);
      margin-bottom: 24px;
      letter-spacing: .04em;
      text-align: center;
    }
    
    .search-row {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 540px) {
      .search-row { flex-direction: column; }
    }
    
    #search-input {
      flex: 1;
      padding: 16px 24px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: var(--navy);
      border-radius: 10px;
      font-size: 1.2rem;
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      outline: none;
      transition: all .2s;
      min-height: 60px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    #search-input::placeholder { color: #94a3b8; }
    #search-input:focus {
      border-color: var(--navy);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0,26,77,.1);
    }
    
    #btn-search {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 0 36px;
      border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      cursor: pointer;
      white-space: nowrap;
      min-height: 60px;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,26,77,0.2);
    }
    #btn-search:hover {
      background: var(--navy-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,26,77,0.3);
    }
    #btn-search:active { transform: scale(0.98); }

    #search-results {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* INJECTED JUGADOR CARD BY JS */
    .jugador-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all .2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      gap: 20px;
      flex-wrap: wrap;
    }
    .jugador-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
    }
    .jugador-info {
      text-align: left;
      flex: 1;
      min-width: 220px;
    }
    .jugador-info strong {
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--navy);
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .jugador-info span {
      display: block;
      font-size: 1.05rem;
      color: #64748b;
      font-family: 'Barlow', sans-serif;
      margin-bottom: 4px;
    }
    .jugador-info span:last-child {
      color: var(--navy) !important;
      font-weight: 700 !important;
      font-size: 1.15rem;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    
    .btn-ver-pdf {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 1.2rem;
      letter-spacing: .05em;
      cursor: pointer;
      text-decoration: none;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(214,13,13,0.25);
    }
    .btn-ver-pdf:hover {
      background: var(--red-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(214,13,13,0.35);
    }
    .btn-ver-pdf:active { transform: scale(0.98); }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--navy);
      color: #fff;
      padding: 16px 32px;
      border-radius: 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform .4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity .3s;
      opacity: 0;
      z-index: 9999;
      white-space: nowrap;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* Loading text style injected by JS */
    #search-results p {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="../assets/img/logo.png" alt="Copa Cajamarca" class="header-logo" onerror="this.style.display='none'">
      <div>
        <div class="header-title-sup">Copa Cajamarca 2026</div>
        <div class="header-title-main">PORTAL DELEGADOS</div>
      </div>
    </div>
    <div class="page-bar">
      <div class="page-bar-inner">ACCESO EXCLUSIVO</div>
    </div>
  </header>

  <div class="content-wrapper">
    <!-- ═══════════ LOGIN ═══════════ -->
    <div id="login-view" class="card">
      <img src="../assets/img/logo.png" alt="Copa Cajamarca" class="login-logo"
           onerror="this.style.display='none';document.getElementById('logo-fb-del').style.display='flex';">
      <div id="logo-fb-del">CC</div>
      
      <h1 class="login-title">INICIAR SESIÓN</h1>
      <p class="login-sub">Ingrese su DNI para continuar</p>

      <form id="form-login" action="#" onsubmit="event.preventDefault();">
        <label class="dni-label">NÚMERO DE DNI</label>
        <div class="dni-grid" id="dni-container">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" autofocus>
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
        </div>
        <input type="hidden" id="dni-input" name="username">
        <button type="submit" id="btn-login" class="btn-primary">AUTENTICAR</button>
      </form>
    </div>

    <!-- ═══════════ DASHBOARD ═══════════ -->
    <div id="dashboard">
      <div class="dash-header">
        <div class="dash-brand">
          <img src="" id="del-logo" alt="Logo Equipo">
          <div>
            <div class="dash-name" id="del-nombre">BIENVENIDO</div>
            <div class="dash-team" id="del-equipo">Cargando equipo...</div>
          </div>
        </div>
        <button id="btn-logout">SALIR</button>
      </div>

      <div class="search-section">
        <h3>AUDITAR JUGADOR RIVAL</h3>
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Ingrese DNI o Apellido">
          <button id="btn-search">BUSCAR</button>
        </div>
        <div id="search-results"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="delegados.js?v=11"></script>
</body>
</html>
