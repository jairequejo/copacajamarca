<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#001a4d" />
  <title>Portal Delegados · Copa Cajamarca</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #001a4d;
      --gold: #ffba00;
      --red: #d60d0d;
      --bg: #eef2f7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--navy);
      background-image: repeating-linear-gradient(-45deg, transparent 0, transparent 28px, rgba(255,255,255,.014) 28px, rgba(255,255,255,.014) 29px);
      min-height: 100dvh;
      font-family: 'Barlow', sans-serif;
      display: flex;
      flex-direction: column;
      color: #fff;
    }
    
    /* Header Template */
    .site-header {
      background: var(--navy);
      width: 100%;
      z-index: 10;
      position: relative;
    }

    .content-wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,186,0,0.18);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .btn-primary {
      background: var(--gold);
      color: #5a4400;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 16px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      min-height: 52px;
      transition: transform .15s, box-shadow .15s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255,186,0,.2);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,186,0,.4); }
    .btn-primary:active { transform: scale(0.98); }

    /* Login Specifics */
    .login-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem; color: #fff;
      letter-spacing: .04em; line-height: 1; margin-bottom: 8px;
    }
    .login-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.5); margin-bottom: 32px;
    }

    .dni-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: #fff;
      margin-bottom: 16px;
      display: block;
    }
    
    .dni-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-bottom: 32px;
    }
    .dni-box {
      width: 100%;
      aspect-ratio: 1 / 1.2;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,.15);
      color: var(--gold);
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      text-align: center;
      padding: 0;
      outline: none;
      transition: all .2s;
    }
    .dni-box:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,186,0,.2);
      transform: translateY(-2px);
    }
    .dni-box.filled {
      border-color: var(--gold);
      background: rgba(255,186,0,.15);
    }

    /* Dashboard */
    #dashboard {
      display: none;
      width: 100%;
      max-width: 600px;
    }
    
    .dash-header {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,186,0,0.18);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .dash-brand { display: flex; align-items: center; gap: 16px; }
    
    .dash-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; color: #fff; line-height: 1;
      letter-spacing: 0.04em;
    }
    .dash-team {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold); margin-top: 6px;
    }
    
    .club-logo {
      width: 64px; height: 64px; border-radius: 50%;
      background: #fff; object-fit: cover;
      border: 2px solid var(--gold);
      display: none;
    }
    
    #btn-logout {
      background: rgba(214,13,13,.15); color: #ff6b6b;
      border: 1px solid rgba(214,13,13,.4);
      padding: 12px 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase;
      border-radius: 10px; cursor: pointer; transition: all .15s;
      min-height: 52px;
    }
    #btn-logout:hover { background: var(--red); color: #fff; }

    .search-section {
      background: rgba(255,255,255,0.96);
      padding: 24px; border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      border-left: 6px solid var(--gold);
      color: var(--navy);
    }
    .search-section h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; color: var(--navy);
      margin-bottom: 20px; letter-spacing: .04em;
    }
    .search-row { display: flex; gap: 12px; }
    
    #search-input {
      flex: 1; padding: 16px 20px;
      background: #fff;
      border: 2px solid #cbd5e1;
      color: var(--navy); border-radius: 10px;
      font-size: 1.2rem; font-family: 'Barlow', sans-serif; outline: none;
      transition: border-color .2s;
      min-height: 56px;
    }
    #search-input:focus { border-color: var(--navy); }
    
    #btn-search {
      background: var(--navy); color: #fff; border: none;
      padding: 0 28px; border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: 1.2rem;
      text-transform: uppercase; letter-spacing: .08em;
      cursor: pointer; white-space: nowrap;
      min-height: 56px;
      transition: background .2s;
    }
    #btn-search:hover { background: #00287a; }

    /* Jugador Card (Injected by JS) */
    .jugador-card {
      background: #f8fafc; border: 2px solid #e2e8f0;
      border-radius: 12px; padding: 20px; margin-top: 16px;
      display: flex; justify-content: space-between; align-items: center;
      transition: transform .2s, border-color .2s;
    }
    .jugador-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
    }
    .jugador-info { text-align: left; }
    .jugador-info strong {
      display: block; font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; text-transform: uppercase;
      color: var(--navy); font-weight: 800; line-height: 1.1;
    }
    .jugador-info span {
      font-size: 1.05rem; color: #475569; display: block; margin-top: 6px;
      font-family: 'Barlow', sans-serif;
    }
    .btn-ver-pdf {
      background: var(--red); color: #fff; border: none;
      padding: 12px 24px; border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; text-transform: uppercase; font-size: 1.1rem; cursor: pointer;
      text-decoration: none;
      min-height: 52px; display: inline-flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .btn-ver-pdf:hover { background: #b90b0b; }

    /* Toast */
    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy); color: #fff;
      padding: 18px 36px; border-radius: 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 1.2rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1), opacity .3s;
      opacity: 0; z-index: 9999;
      white-space: nowrap; pointer-events: none;
      text-transform: uppercase; letter-spacing: .05em;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner" style="max-width:860px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:16px;">
      <img src="../assets/img/logo.png" alt="Copa Cajamarca" style="width:52px;height:52px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px rgba(255,186,0,.5),0 3px 10px rgba(0,0,0,.35);" onerror="this.style.display='none'">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase;">Copa Cajamarca 2026</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:#fff;letter-spacing:.04em;line-height:1;">PORTAL DELEGADOS</div>
      </div>
    </div>
    <!-- Gold bar -->
    <div style="background:#ffba00;border-bottom:3px solid #f1a200;">
      <div style="max-width:860px;margin:0 auto;padding:10px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:#001a4d;">ACCESO EXCLUSIVO</div>
    </div>
  </header>

  <div class="content-wrapper">
    <!-- ═══════════ LOGIN ═══════════ -->
    <div id="login-view" class="card">
      <img src="../assets/img/logo.png" alt="Copa Cajamarca" style="width:100px;height:100px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 4px rgba(255,186,0,.5),0 8px 32px rgba(0,0,0,.45);margin:0 auto 24px;display:block;"
           onerror="this.style.display='none';document.getElementById('logo-fb-del').style.display='flex';">
      <div id="logo-fb-del" style="display:none;width:100px;height:100px;border-radius:50%;background:#001a4d;border:4px solid #ffba00;margin:0 auto 24px;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:#ffba00;">CC</div>
      
      <h1 class="login-title">INICIAR SESIÓN</h1>
      <p class="login-sub">Ingrese su DNI para continuar</p>

      <form id="form-login" action="#" onsubmit="event.preventDefault();">
        <label class="dni-label">NÚMERO DE DNI</label>
        <div class="dni-grid" id="dni-container">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off" autofocus>
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
          <input type="tel" class="dni-box" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="off">
        </div>
        <input type="hidden" id="dni-input" name="username">
        <button type="submit" id="btn-login" class="btn-primary">AUTENTICAR</button>
      </form>
    </div>

    <!-- ═══════════ DASHBOARD ═══════════ -->
    <div id="dashboard">
      <div class="dash-header">
        <div class="dash-brand">
          <div>
            <div class="dash-name" id="del-nombre">BIENVENIDO</div>
            <div class="dash-team" id="del-equipo">Cargando equipo...</div>
          </div>
        </div>
        <div style="display:flex;gap:16px;align-items:center;">
          <img src="" id="del-logo" class="club-logo" alt="Logo Equipo">
          <button id="btn-logout">SALIR</button>
        </div>
      </div>

      <div class="search-section">
        <h3>AUDITAR JUGADOR RIVAL</h3>
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Ingrese DNI o Apellido">
          <button id="btn-search">BUSCAR</button>
        </div>
        <div id="search-results"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="delegados.js?v=9"></script>
</body>
</html>
